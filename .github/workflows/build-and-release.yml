name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore StageManagerApp/StageManagerApp.csproj

      - name: Publish Windows x64 Executable
        run: |
          dotnet publish StageManagerApp/StageManagerApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./release_output

      - name: Package Executable into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "./release_output/StageManagerApp.exe" -DestinationPath "./StageManagerApp-win-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StageManagerApp-win-x64
          path: ./StageManagerApp-win-x64.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'StageManagerApp v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./StageManagerApp-win-x64.zip
            ./release_output/StageManagerApp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
