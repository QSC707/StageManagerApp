name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore StageManagerApp/StageManagerApp.csproj

      - name: Publish Standalone Executable (Self-Contained + Compressed)
        run: |
          dotnet publish StageManagerApp/StageManagerApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./release_standalone

      - name: Publish Lightweight Executable (Framework-Dependent ~200KB)
        run: |
          dotnet publish StageManagerApp/StageManagerApp.csproj -c Release --self-contained false -o ./release_fdd

      - name: Package Archives
        shell: pwsh
        run: |
          Compress-Archive -Path "./release_standalone/StageManagerApp.exe" -DestinationPath "./StageManagerApp-win-x64-Standalone.zip" -Force
          Compress-Archive -Path "./release_fdd/*" -DestinationPath "./StageManagerApp-FrameworkDependent.zip" -Force
          Copy-Item -Path "./release_standalone/StageManagerApp.exe" -Destination "./StageManagerApp.exe" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StageManagerApp-Builds
          path: |
            ./StageManagerApp-win-x64-Standalone.zip
            ./StageManagerApp-FrameworkDependent.zip
            ./StageManagerApp.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'StageManagerApp v1.0.1 (体积深度优化版)' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./StageManagerApp-win-x64-Standalone.zip
            ./StageManagerApp-FrameworkDependent.zip
            ./StageManagerApp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
